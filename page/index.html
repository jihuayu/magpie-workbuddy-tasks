<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkBuddy 任务</title>
  <link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wb">
    <header class="wb-head">
      <div>
        <h1>WorkBuddy 任务</h1>
        <p class="wb-sub">批量成长、旅行与夜猫任务 · 引擎在 magpie 内运行</p>
      </div>
      <button type="button" id="refresh" class="wb-btn">刷新</button>
    </header>

    <p id="msg" class="wb-msg" role="status" hidden></p>

    <section class="wb-summary" aria-label="概览">
      <div><span class="wb-k">账号</span><strong id="accounts-count">—</strong></div>
      <div><span class="wb-k">今日积分</span><strong id="credits">—</strong></div>
      <div><span class="wb-k">今日能量</span><strong id="energy">—</strong></div>
      <div><span class="wb-k">排程</span><strong id="scheduler">—</strong></div>
    </section>

    <div class="wb-actions">
      <button type="button" id="run" class="wb-btn wb-primary">运行全部</button>
      <button type="button" id="stop" class="wb-btn">停止</button>
      <label class="wb-check"><input type="checkbox" id="sched"> 小时排程</label>
    </div>

    <section class="wb-panel" aria-labelledby="job-title">
      <div class="wb-panel-head">
        <h2 id="job-title">当前任务</h2>
        <span id="job-state" class="wb-tag">无</span>
      </div>
      <div id="job" class="wb-empty">还没有运行过任务。</div>
    </section>

    <section class="wb-panel" aria-labelledby="acct-title">
      <h2 id="acct-title">账号与任务</h2>
      <div id="accounts" class="wb-empty">读取中…</div>
    </section>

    <section class="wb-panel" aria-labelledby="settings-title">
      <h2 id="settings-title">设置</h2>
      <label class="wb-check"><input type="checkbox" id="claim"> 完成后自动领奖</label>
      <p class="wb-hint">账号来自 magpie 已登录的 WorkBuddy 国内版；凭据不会进入页面。</p>
    </section>
  </main>
</body>
</html>
